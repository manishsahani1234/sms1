            );
        }

        function NoticesTab({ data }) {
            return (
                <div class="py-12 px-4 max-w-4xl mx-auto space-y-4">
                    <h2 class="font-royal text-3xl font-extrabold text-navy-900 text-center">Official Notices & Circulars</h2>
                    {data.notices.map(n => (
                        <div key={n.id} class="bg-white p-5 rounded-xl border shadow space-y-1 text-xs">
                            <div class="flex justify-between font-bold text-crimson-900">
                                <span>{n.category}</span>
                                <span class="text-slate-400">{n.date}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-sm">{n.title}</h3>
                            <p class="text-slate-600">{n.desc}</p>
                        </div>
                    ))}
                </div>
            );
        }

        function GalleryTab({ data }) {
            return (
                <div class="py-12 px-4 max-w-6xl mx-auto space-y-6">
                    <h2 class="font-royal text-3xl font-extrabold text-navy-900 text-center">Campus Life & Event Gallery</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        {data.gallery.map(g => (
                            <div key={g.id} class="bg-white rounded-xl overflow-hidden border shadow hover:shadow-lg transition">
                                <img src={g.image} alt={g.title} class="w-full h-48 object-cover" />
                                <div class="p-3 text-xs font-bold text-slate-900">{g.title}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ContactTab({ data }) {
            return (
                <div class="py-12 px-4 max-w-6xl mx-auto space-y-6">
                    <h2 class="font-royal text-3xl font-extrabold text-navy-900 text-center">Contact School Office</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl border text-xs space-y-3">
                            <h3 class="font-bold text-sm text-navy-900">Get In Touch</h3>
                            <form onSubmit={e => { e.preventDefault(); alert("Enquiry Sent!"); }} class="space-y-3">
                                <input placeholder="Full Name" class="w-full p-2.5 border rounded" />
                                <input placeholder="Phone Number" class="w-full p-2.5 border rounded" />
                                <textarea placeholder="Message" rows="3" class="w-full p-2.5 border rounded"></textarea>
                                <button class="w-full bg-crimson-900 text-gold-400 font-extrabold py-2.5 rounded">Submit Message</button>
                            </form>
                        </div>
                        <div class="bg-navy-950 text-white p-6 rounded-xl space-y-3 text-xs border-t-4 border-gold-500">
                            <h3 class="font-royal font-bold text-sm text-gold-400">Campus Location</h3>
                            <p><i class="fa-solid fa-location-dot text-gold-400 mr-2"></i>{data.schoolInfo.address}</p>
                            <p><i class="fa-solid fa-phone text-gold-400 mr-2"></i>{data.schoolInfo.phone}</p>
                            <p><i class="fa-solid fa-envelope text-gold-400 mr-2"></i>{data.schoolInfo.email}</p>
                            <div class="h-40 rounded overflow-hidden mt-2">
                                <iframe src={data.schoolInfo.mapUrl} class="w-full h-full border-0"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ONLINE ADMISSION PORTAL */
        function AdmissionPortal({ data, setData }) {
            const [submitted, setSubmitted] = useState(false);
            const [name, setName] = useState('');
            const [cls, setCls] = useState('10th');
            const [parent, setParent] = useState('');
            const [phone, setPhone] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const newAdm = {
                    id: `ADM-2026-0${data.admissions.length + 1}`,
                    applicantName: name,
                    classApplied: cls,
                    parentName: parent,
                    phone: phone,
                    status: 'Pending',
                    date: new Date().toISOString().split('T')[0]
                };
                setData(prev => ({ ...prev, admissions: [newAdm, ...prev.admissions] }));
                setSubmitted(true);
            };

            return (
                <div class="py-10 px-4 max-w-2xl mx-auto space-y-6 flex-1">
                    <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-crimson-900 space-y-4 text-xs">
                        <h2 class="font-royal text-xl font-bold text-navy-900">Online Admission Application (Classes 8th to 12th)</h2>
                        {submitted ? (
                            <div class="text-center py-6 space-y-2">
                                <i class="fa-solid fa-circle-check text-4xl text-emerald-600"></i>
                                <h3 class="font-bold text-base text-slate-900">Application Submitted Successfully!</h3>
                                <p class="text-slate-500">Our admission desk will verify your details and contact you.</p>
                                <button onClick={() => setSubmitted(false)} class="bg-crimson-900 text-gold-400 px-4 py-2 rounded font-bold">Submit Another</button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} class="space-y-3">
                                <div>
                                    <label class="block font-semibold mb-1">Student Full Name *</label>
                                    <input required value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Varun Malhotra" class="w-full p-2.5 border rounded" />
                                </div>
                                <div>
                                    <label class="block font-semibold mb-1">Class Applied *</label>
                                    <select value={cls} onChange={e => setCls(e.target.value)} class="w-full p-2.5 border rounded">
                                        <option value="8th">Class 8th</option>
                                        <option value="9th">Class 9th</option>
                                        <option value="10th">Class 10th Board</option>
                                        <option value="11th (Science)">Class 11th (Science)</option>
                                        <option value="12th (Science)">Class 12th (Science)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-semibold mb-1">Parent / Guardian Name *</label>
                                    <input required value={parent} onChange={e => setParent(e.target.value)} placeholder="e.g. Deepak Malhotra" class="w-full p-2.5 border rounded" />
                                </div>
                                <div>
                                    <label class="block font-semibold mb-1">Mobile Number *</label>
                                    <input required value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. 9876543210" class="w-full p-2.5 border rounded" />
                                </div>
                                <button type="submit" class="w-full bg-crimson-900 text-gold-400 font-extrabold py-3 rounded shadow uppercase">Submit Online Application</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        /* ADMIN PORTAL */
        function AdminPortal({ data }) {
            return (
                <div class="py-8 px-4 max-w-6xl mx-auto space-y-6 flex-1 text-xs">
                    <div class="bg-navy-950 text-white p-6 rounded-xl border-t-4 border-gold-500 shadow flex justify-between items-center">
                        <div>
                            <h2 class="font-royal text-xl font-bold">School Administration Portal</h2>
                            <p class="text-slate-400">Total Enrolled: {data.students.length} | Applications: {data.admissions.length}</p>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border space-y-4 shadow">
                        <h3 class="font-bold text-sm text-slate-900">Student Roster</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border">
                                <thead class="bg-slate-100 font-bold">
                                    <tr>
                                        <th class="p-2 border">Roll</th>
                                        <th class="p-2 border">Name</th>
                                        <th class="p-2 border">Class</th>
                                        <th class="p-2 border">Fee Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.students.map(s => (
                                        <tr key={s.id} class="hover:bg-slate-50">
                                            <td class="p-2 border">{s.rollNo}</td>
                                            <td class="p-2 border font-bold">{s.name}</td>
                                            <td class="p-2 border">{s.class}</td>
                                            <td class="p-2 border font-bold text-emerald-600">{s.feeStatus}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        /* TEACHER PORTAL */
        function TeacherPortal({ data }) {
            return (
                <div class="py-8 px-4 max-w-5xl mx-auto space-y-6 flex-1 text-xs">
                    <div class="bg-crimson-900 text-gold-400 p-6 rounded-xl shadow border-b-2 border-gold-500">
                        <h2 class="font-royal text-xl font-bold">Faculty Portal</h2>
                        <p class="text-slate-200">Attendance & Marks Entry System</p>
                    </div>

                    <div class="bg-white p-6 rounded-xl border space-y-3 shadow">
                        <h3 class="font-bold text-sm text-slate-900">Class 10th Student Marks & Attendance</h3>
                        {data.students.slice(0, 3).map(s => (
                            <div key={s.id} class="p-3 border rounded flex justify-between items-center">
                                <div><span class="font-bold">{s.name}</span> (Roll: {s.rollNo})</div>
                                <span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-bold">Attendance: {s.attendance}%</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        /* STUDENT PORTAL */
        function StudentPortal({ data }) {
            const student = data.students[2];
            return (
                <div class="py-8 px-4 max-w-5xl mx-auto space-y-6 flex-1 text-xs">
                    <div class="bg-navy-900 text-white p-6 rounded-xl border-t-4 border-gold-500 shadow flex justify-between items-center">
                        <div>
                            <h2 class="font-royal text-xl font-bold">Welcome, {student.name}</h2>
                            <p class="text-slate-300">{student.class} Section {student.section} (Science)</p>
                        </div>
                        <span class="bg-gold-500 text-navy-950 px-3 py-1 rounded font-bold">Attendance: {student.attendance}%</span>
                    </div>

                    <div id="printable-area" class="bg-white p-6 rounded-xl border space-y-4 shadow">
                        <h3 class="font-royal font-bold text-sm text-slate-900">Class 12th Board Term Progress Report Card</h3>
                        <table class="w-full text-left border">
                            <thead class="bg-slate-100 font-bold">
                                <tr>
                                    <th class="p-2 border">Subject</th>
                                    <th class="p-2 border">Marks Obtained</th>
                                    <th class="p-2 border">Grade</th>
                                </tr>
                            </thead>
                            <tbody>
                                {Object.entries(student.marks).map(([sub, score]) => (
                                    <tr key={sub}>
                                        <td class="p-2 border font-bold">{sub}</td>
                                        <td class="p-2 border">{score} / 100</td>
                                        <td class="p-2 border font-bold text-emerald-600">A1</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        <div class="flex justify-end no-print">
                            <button onClick={() => window.print()} class="bg-crimson-900 text-gold-400 px-4 py-2 rounded font-bold">
                                <i class="fa-solid fa-print mr-1"></i> Print Report Card PDF
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SMSApp />);
    </script>
</body>
</html>
